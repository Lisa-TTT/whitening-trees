[platformio]
src_dir = firmware
default_envs = esp32_bench

[env:esp32_bench]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter = +<common/> +<esp32/>
build_flags = -Ifirmware/common

[env:stm32_tools]
platform = ststm32@19.0.0
board = black_f407zg
framework = cmsis\n